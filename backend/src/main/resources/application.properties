server.port=${PORT:8080} 
spring.application.name=protein-viz-backend

# Logging
logging.level.com.proteinviz=INFO
logging.level.org.springframework.web=WARN

# Cache
spring.cache.type=caffeine

# Jackson
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# Anthropic Claude API Key
# Set via environment variable: export ANTHROPIC_API_KEY=sk-ant-...
# Or set directly here (not recommended for production):
# anthropic.api.key=sk-ant-your-key-here
anthropic.api.key=${ANTHROPIC_API_KEY:}